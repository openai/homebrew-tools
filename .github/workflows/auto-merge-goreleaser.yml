name: Auto-merge GoReleaser Homebrew PRs

on:
  workflow_run:
    workflows:
      - Validate cask
    types:
      - completed

permissions: {}

concurrency:
  group: goreleaser-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify trusted GoReleaser PR
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      pr-number: ${{ steps.verify.outputs.pr-number }}

    steps:
      - name: Verify PR is an eligible GoReleaser recipe update
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          VALIDATED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          case "${VALIDATED_HEAD_BRANCH}" in
            openai-*) expected_path="Casks/openai.rb" ;;
            orchard-*) expected_path="Formula/orchard.rb" ;;
            softnet-*) expected_path="Formula/softnet.rb" ;;
            tart-guest-agent-*) expected_path="Formula/tart-guest-agent.rb" ;;
            tart-*) expected_path="Formula/tart.rb" ;;
            *)
              echo "Skipping non-GoReleaser branch: ${VALIDATED_HEAD_BRANCH}"
              exit 0
              ;;
          esac

          if [ -z "${PR_NUMBER}" ]; then
            echo "No pull request was attached to this workflow_run event."
            exit 1
          fi

          data="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" \
            --json author,baseRefName,body,files,headRefName,headRefOid,headRepositoryOwner,isCrossRepository,isDraft,state,statusCheckRollup)"

          author="$(echo "${data}" | jq -er '.author.login')"
          if [ "${author}" != "app/openai-homebrew-releaser" ]; then
            echo "Skipping PR not authored by the GoReleaser app."
            exit 0
          fi

          echo "${data}" | jq -e \
            --arg sha "${VALIDATED_SHA}" \
            --arg head_branch "${VALIDATED_HEAD_BRANCH}" \
            --arg expected_path "${expected_path}" \
            '
              .state == "OPEN" and
              .isDraft == false and
              .author.login == "app/openai-homebrew-releaser" and
              .baseRefName == "main" and
              .headRefName == $head_branch and
              (.headRefName | test("^(openai-update|(openai|orchard|softnet|tart|tart-guest-agent)-[0-9]+\\.[0-9]+\\.[0-9]+)$")) and
              .headRefOid == $sha and
              .headRepositoryOwner.login == "openai" and
              .isCrossRepository == false and
              ((.body // "") | contains("Automated with [GoReleaser]")) and
              (.files | length == 1) and
              (.files[0].path == $expected_path) and
              ((.files[0].changeType == "ADDED") or (.files[0].changeType == "MODIFIED")) and
              any(.statusCheckRollup[]?;
                .__typename == "CheckRun" and
                .workflowName == "Validate cask" and
                .name == "validate-cask" and
                .status == "COMPLETED" and
                .conclusion == "SUCCESS"
              )
            '

          changed_files="$(gh pr diff "${PR_NUMBER}" --repo "${REPO}" --name-only)"
          if [ "${changed_files}" != "${expected_path}" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "${changed_files}"
            exit 1
          fi

          echo "pr-number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

  automerge:
    name: Auto-merge trusted GoReleaser PR
    needs: verify
    if: needs.verify.outputs.pr-number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: goreleaser-automerge
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Wait for required checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.verify.outputs.pr-number }}
          REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # --watch only waits for checks already registered. CodeQL may not
          # exist yet, so poll for its successful completion at the validated head.
          while true; do
            data="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid,statusCheckRollup)"
            echo "${data}" | jq -e --arg sha "${VALIDATED_SHA}" '.headRefOid == $sha' > /dev/null
            codeql="$(echo "${data}" | jq -r '
              [.statusCheckRollup[]? | select(.__typename == "CheckRun" and .name == "CodeQL")] |
              if any(.[]; .status == "COMPLETED" and
                (.conclusion | IN("FAILURE", "CANCELLED", "TIMED_OUT", "ACTION_REQUIRED", "STARTUP_FAILURE", "STALE")))
              then "failed"
              elif any(.[]; .status == "COMPLETED" and .conclusion == "SUCCESS") then "success"
              else "pending" end
            ')"
            case "${codeql}" in
              success) break ;;
              failed) echo "Required CodeQL check failed."; exit 1 ;;
              pending) echo "Waiting for CodeQL to appear and succeed."; sleep 10 ;;
            esac
          done

          gh pr checks "${PR_NUMBER}" --repo "${REPO}" \
            --required --watch --fail-fast --interval 10

      - name: Create GoReleaser app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Squash merge validated release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ needs.verify.outputs.pr-number }}
          REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Merge immediately at the validated head; do not leave auto-merge
          # enabled for a later, potentially ineligible commit. The release app
          # bypasses review only; separate validation and CodeQL rules still apply.
          gh pr merge "${PR_NUMBER}" \
            --repo "${REPO}" \
            --squash \
            --admin \
            --delete-branch \
            --match-head-commit "${VALIDATED_SHA}"
